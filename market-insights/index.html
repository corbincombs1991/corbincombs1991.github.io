<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Insights | Corbin Combs</title>
  <meta name="description" content="A read-only, synthetic chart-pattern research viewer.">
  <style>
    :root{--ink:#060a08;--panel:#0b110e;--paper:#eef0f4;--muted:#93a298;--accent:#52ff93;--line:rgba(255,255,255,.12);--warn:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.55 Inter,system-ui,sans-serif}main{max-width:960px;margin:auto;padding:36px 20px 72px}nav{border-bottom:1px solid var(--line);padding:14px 20px}nav a{color:var(--muted);text-decoration:none;display:inline-block;margin-right:18px}a{color:var(--accent)}h1,h2{font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.15}h1{font-size:clamp(2rem,5vw,3.2rem);margin:.3em 0}.kicker{color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}.lead,.meta,.status,.note{color:var(--muted)}.controls,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:20px 0}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end}label{display:grid;gap:6px;color:var(--muted);font-size:.86rem}select{background:#101713;color:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px;min-width:170px;font:inherit}.card h2{font-size:1.2rem}.chart{width:100%;height:auto;background:#080d0a;border-radius:10px;border:1px solid var(--line)}.chart text{fill:var(--muted);font-size:12px}.chart .grid{stroke:var(--line)}.chart .query{stroke:var(--accent)}.chart .match{stroke:#8eb9ff}.chart .future{stroke:var(--warn);stroke-dasharray:5 4}.chart .boundary{stroke:var(--warn);stroke-dasharray:3 4}.tag{display:inline-block;border:1px solid rgba(255,209,102,.4);color:var(--warn);border-radius:999px;padding:2px 9px;font-size:.75rem;margin-right:6px}.error{color:#ff9b9b}.empty{padding:28px;text-align:center;border:1px dashed var(--line);color:var(--muted)}@media(max-width:600px){main{padding:26px 14px 56px}.controls{display:grid}.controls>*{width:100%}select{width:100%}}
  </style>
</head>
<body>
  <nav><a href="/">CC.</a><a href="/ciovacco">Market Notes</a><a href="/market-insights/" aria-current="page">Market Insights</a></nav>
  <main>
    <p class="kicker">Read-only research viewer</p>
    <h1>Chart-pattern <span style="color:var(--accent)">market insights</span></h1>
    <p class="lead">Explore precomputed historical matches. This is synthetic fixture data for a research interface—not a forecast, trading system, or established edge.</p>
    <p><span class="tag">Synthetic fixture</span><span class="tag">No live data</span></p>
    <section class="controls" aria-label="Report controls">
      <label for="report">Report/query date<select id="report"></select></label>
      <label for="k">Available k<select id="k"></select></label>
    </section>
    <p id="status" class="status" role="status" aria-live="polite">Loading report manifest…</p>
    <section id="content" hidden></section>
    <noscript><p class="note">JavaScript is required for the local report controls.</p></noscript>
  </main>
  <script>
  (() => {
    "use strict";
    const reportSelect=document.querySelector("#report"), kSelect=document.querySelector("#k"), status=document.querySelector("#status"), content=document.querySelector("#content");
    const text=(node,value)=>{node.textContent=value==null?"":String(value)};
    const safeAsset=(asset)=>typeof asset==="string" && /^reports\/[A-Za-z0-9._-]+\.json$/.test(asset) ? asset : null;
    const svg=(report)=>{const rows=Array.isArray(report.matching_records)?report.matching_records:[], q=Array.isArray(report.query&&report.query.normalized)?report.query.normalized:[], w=760,h=240,p=30; const all=[...q,...rows.flatMap(r=>Array.isArray(r.normalized)?r.normalized:[])];const min=Math.min(...all,0),max=Math.max(...all,1),x=i=>p+i*10,y=v=>h-p-(v-min)/(max-min||1)*(h-2*p);let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Precomputed query and match chart"><line class="grid" x1="${p}" x2="${w-p}" y1="${h/2}" y2="${h/2}"/>`; const line=(vals,cls)=>vals.length?`<polyline class="${cls}" fill="none" stroke-width="3" points="${vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ")}"/>`:"";s+=line(q,"query");rows.forEach(r=>{s+=line(Array.isArray(r.normalized)?r.normalized:[],"match")});s+=`<line class="boundary" x1="${x(q.length-1)}" x2="${x(q.length-1)}" y1="${p}" y2="${h-p}"/><text x="${p}" y="18">decision</text><text x="${Math.min(w-p-8,x(q.length-1)+6)}" y="18">boundary</text></svg>`;return s};
    const render=(report,entry)=>{content.replaceChildren();const card=document.createElement("article");card.className="card";const h=document.createElement("h2");text(h,`Query ${entry.query_date||"undated"} · k=${entry.k||"—"}`);card.append(h);const meta=document.createElement("p");meta.className="meta";text(meta,`Route: ${report.route||"unknown"} · matches shown: ${report.matching?.selected_count??0} · source as-of: ${entry.source_as_of||"not supplied"}`);card.append(meta);const chart=document.createElement("div");chart.innerHTML=svg(report);card.append(chart);const note=document.createElement("p");note.className="note";text(note,"Decision-versus-outcome boundary is shown in yellow. Distances and actual sample counts are from the frozen report; outcomes are historical context only.");card.append(note);content.append(card);content.hidden=false};
    const load=async()=>{try{const manifest=await (await fetch("manifest.json",{credentials:"omit"})).json();if(manifest.schema_version!==1||!Array.isArray(manifest.reports))throw Error("unsupported or malformed manifest");reportSelect.replaceChildren(...manifest.reports.map((r,i)=>{const o=document.createElement("option");o.value=String(i);text(o,`${r.query_date||"undated"} · ${r.report_id||"report"}`);return o}));const ks=[...new Set(manifest.reports.map(r=>r.k).filter(Number.isFinite))];kSelect.replaceChildren(...ks.map(k=>{const o=document.createElement("option");o.value=String(k);text(o,`k=${k}`);return o}));const show=async()=>{const entry=manifest.reports[Number(reportSelect.value)];const asset=safeAsset(entry&&entry.asset);if(!asset)throw Error("unsafe report asset link");const response=await fetch(asset,{credentials:"omit"});if(!response.ok)throw Error("report asset unavailable");const report=await response.json();if(report.schema_version!==1)throw Error("unsupported report version");render(report,entry);text(status,`Loaded ${entry.report_id||"report"}. Synthetic fixture; generated ${manifest.generation_timestamp||"unknown"}.`)};reportSelect.addEventListener("change",()=>show().catch(fail));kSelect.addEventListener("change",()=>show().catch(fail));await show()}catch(error){fail(error)}function fail(error){content.hidden=true;status.className="status error";text(status,`Unable to load this report: ${error.message||"unknown error"}`)}};load();
  })();
  </script>
</body>
</html>
