name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js market-insights/*.js; do
            if [ -f "$file" ]; then node --check "$file"; fi
          done
      - name: Check dates, filters, and report rendering
        run: node --test tools/tests/*.test.cjs
