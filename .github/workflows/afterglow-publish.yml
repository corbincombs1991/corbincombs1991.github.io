name: Build and publish Afterglow Vintage

on:
  pull_request:
    paths:
      - '_afterglow/**'
      - '_afterglow-deploy/**'
      - '.github/workflows/afterglow-publish.yml'
  push:
    branches: [main]
    paths:
      - '_afterglow/**'
      - '_afterglow-deploy/**'
      - '.github/workflows/afterglow-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

concurrency:
  group: afterglow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: _afterglow/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix _afterglow
      - name: Build static subdirectory site
        run: npm run build --prefix _afterglow
      - name: Validate static routes, SEO, and assets
        run: node _afterglow-deploy/verify.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: afterglow-static
          path: _afterglow/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Skip superseded source builds
        id: freshness
        env:
          BUILT_COMMIT: ${{ github.sha }}
        run: |
          if git diff --quiet "$BUILT_COMMIT" HEAD -- _afterglow _afterglow-deploy .github/workflows/afterglow-publish.yml; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Newer Afterglow source is on main; its workflow will publish it.'
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.freshness.outputs.current == 'true'
        with:
          name: afterglow-static
          path: _afterglow/dist/
      - name: Confirm existing Pages settings
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node _afterglow-deploy/pages.mjs
      - name: Update only the Afterglow published directory
        if: steps.freshness.outputs.current == 'true'
        run: |
          node _afterglow-deploy/sync.mjs
          git diff --exit-code -- . ':!afterglowvintage'
          git add --all -- afterglowvintage
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: publish Afterglow Vintage static site'
            git push origin HEAD:main
          fi
      - name: Rebuild existing Pages deployment and verify production
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node _afterglow-deploy/pages.mjs --request
